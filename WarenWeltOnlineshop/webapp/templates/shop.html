{% extends "base.html" %}
{% block title %}Shop{% endblock %}
{% block content %}
<!-- Überschrift für die Shop-Seite -->
<h1 class="text-2xl font-bold mb-6">Produkte</h1>



<!-- Filter für Kategorien -->
<div class="mb-6 flex gap-4">
  <a href="{{ url_for('views.shop') }}"
     class="px-4 py-2 rounded {{ not selected_category and 'bg-sky-400 text-white' or 'bg-gray-200' }}">
    Alle
  </a>
  <a href="{{ url_for('views.shop', category='books') }}"
     class="px-4 py-2 rounded {{ selected_category == 'books' and 'bg-sky-400 text-white' or 'bg-gray-200' }}">
    Bücher
  </a>
  <a href="{{ url_for('views.shop', category='electronics') }}"
     class="px-4 py-2 rounded {{ selected_category == 'electronics' and 'bg-sky-400 text-white' or 'bg-gray-200' }}">
    Elektronik
  </a>
  <a href="{{ url_for('views.shop', category='clothing') }}"
     class="px-4 py-2 rounded {{ selected_category == 'clothing' and 'bg-sky-400 text-white' or 'bg-gray-200' }}">
    Kleidung
  </a>
</div>

<!-- Produktübersicht als Grid -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-8">
  {% for product in products %}
  <!-- Einzelnes Produkt als Karte -->
  <div class="border rounded-lg p-4">
    <!-- Produktbild -->
    <img src="{{ product.image_url }}" alt="{{ product.name }}" class="h-32 w-32 mx-auto object-contain mb-2"/>
    <!-- Produktname -->
    <h2 class="text-lg font-semibold">{{ product.name }}</h2>
    <!-- Produktpreis -->
    <p class="text-gray-700 mb-2">{{ product.price }} €</p>
    <!-- Link zur Produktdetailseite -->
    <a href="{{ url_for('views.product_detail', product_id=product.id) }}" class="text-blue-600 underline">Details</a>
    <!-- Link zum Hinzufügen in den Warenkorb -->
    <a href="{{ url_for('views.add_to_cart', product_id=product.id) }}" class="ml-4 text-green-600 underline">In den Warenkorb</a>
  </div>
  {% endfor %}
</div>
{% endblock %}
