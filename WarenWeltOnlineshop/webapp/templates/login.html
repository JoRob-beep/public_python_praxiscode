{% extends "base.html" %} 
{% block title %}Anmelden{% endblock %} 
{% block content %}
<form method="POST" class="max-w-sm mx-auto mt-10">
  <h3 class="text-center text-2xl font-bold mb-6">Anmelden</h3>
  
  <div class="mb-4">
    <label for="email" class="block text-gray-700 text-sm font-bold mb-2">E-Mail-Adresse</label>
    <input type="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="email" name="email" placeholder="E-Mail-Adresse" />
  </div>
  
  <div class="mb-6">
    <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Passwort</label>
    <input type="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" id="password" name="password" placeholder="Passwort" />
  </div>
  
  <button type="submit" class="bg-sky-400 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">Anmelden</button>
</form>
{% endblock %}
