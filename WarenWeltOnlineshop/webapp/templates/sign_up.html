{% extends "base.html" %} 
{% block title %}Registrieren{% endblock %} 
{% block content %}
<form method="POST" class="max-w-sm mx-auto mt-10">
  <h3 class="text-center text-2xl font-bold mb-6">Registrieren</h3>
  
  <div class="mb-4">
    <label for="email" class="block text-gray-700 text-sm font-bold mb-2">E-Mail-Adresse</label>
    <input type="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="email" name="email" placeholder="E-Mail-Adresse" />
  </div>

  <div class="mb-4">
    <label for="firstName" class="block text-gray-700 text-sm font-bold mb-2">Vorname(n)</label>
    <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="firstName" name="firstName" placeholder="Vorname(n)" />
  </div>

  <div class="mb-4">
    <label for="companyNumber" class="block text-gray-700 text-sm font-bold mb-2">Firmennummer</label>
    <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="companyNumber" name="companyNumber" placeholder="Firmennummer" />
  </div>

  <div class="mb-4">
    <label for="phone" class="block text-gray-700 text-sm font-bold mb-2">Telefon</label>
    <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="phone" name="phone" placeholder="Telefonnummer" />
  </div>

  <div class="mb-4">
    <label for="address" class="block text-gray-700 text-sm font-bold mb-2">Adresse</label>
    <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="address" name="address" placeholder="Adresse" />
  </div>

  <div class="mb-4">
    <label for="password1" class="block text-gray-700 text-sm font-bold mb-2">Passwort</label>
    <input type="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" id="password1" name="password1" placeholder="Passwort" />
  </div>

  <div class="mb-6">
    <label for="password2" class="block text-gray-700 text-sm font-bold mb-2">Passwort (Bestätigung)</label>
    <input type="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" id="password2" name="password2" placeholder="Passwort wiederholen" />
  </div>

  <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">Registrieren</button>
</form>
{% endblock %}
